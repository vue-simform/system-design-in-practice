name: Teams Notification

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  teams-notify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Send Teams notification
        uses: actions/github-script@v7
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
        with:
          script: |
            const webhookUrl = process.env.TEAMS_WEBHOOK_URL;
            const pr = context.payload.pull_request;

            const payload = {
              "@type": "MessageCard",
              "@context": "http://schema.org/extensions",
              themeColor: "0078d4",
              summary: "Pull Request Raised",
              sections: [{
                activityTitle: `PR #${pr.number}: ${pr.title}`,
                activitySubtitle: `by @${pr.user.login}`,
                text: `Target branch: **${pr.base.ref}**`,
                markdown: true
              }],
              potentialAction: [{
                "@type": "OpenUri",
                name: "View Pull Request",
                targets: [{ os: "default", uri: pr.html_url }]
              }]
            };

            const response = await fetch(webhookUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            });

            if (!response.ok) {
              core.setFailed(`Webhook failed: ${response.status}`);
            }