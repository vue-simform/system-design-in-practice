services:
  - type: web
    name: newsfeed-api
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
    # Persistent disk to maintain db.json data
    disk:
      name: data
      mountPath: /opt/render/project/src
      sizeGB: 1
